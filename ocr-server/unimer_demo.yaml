model:
  arch: unimernet
  model_type: unimernet
  model_config:
    model_name: ./models/unimer
    max_seq_len: 1536

  load_pretrained: True
  pretrained: './models/unimer/unimernet_base.pth'
  tokenizer_config:
    path: ./models/unimer

datasets:
  formula_rec_eval:
    vis_processor:
      eval:
        name: "formula_image_eval"
        image_size:
          - 192
          - 672

run:
  runner: runner_iter
  task: unimernet_train

  batch_size_train: 64
  batch_size_eval: 1
  num_workers: 0

  seed: 42
  output_dir: "./output"

  evaluate: True
  test_splits: [ "eval" ]

  device: "cpu"
  world_size: 1
  dist_url: "env://"
  distributed: False

  generate_cfg:
    temperature: 0.0
