<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Wiki MVP - 物理题图片识别测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.5rem;
      color: #8b5cf6;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #2a2a4a;
    }
    .card h2 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #a78bfa;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #aaa;
    }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3a3a5a;
      background: #0f0f23;
      color: #eee;
      font-size: 0.9rem;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #8b5cf6;
    }
    textarea { resize: vertical; min-height: 60px; }
    .row { margin-bottom: 14px; }
    .row:last-child { margin-bottom: 0; }
    .file-input-wrapper {
      position: relative;
      border: 2px dashed #3a3a5a;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input-wrapper:hover { border-color: #8b5cf6; }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .file-input-wrapper .icon { font-size: 2rem; margin-bottom: 8px; }
    .file-input-wrapper .text { font-size: 0.85rem; color: #888; }
    .preview-img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #8b5cf6;
      color: white;
    }
    .btn-primary:hover { background: #7c3aed; }
    .btn-primary:disabled {
      background: #4a4a6a;
      color: #888;
      cursor: not-allowed;
    }
    .result-box {
      background: #0f0f23;
      border-radius: 8px;
      padding: 16px;
      min-height: 100px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
      border: 1px solid #2a2a4a;
      max-height: 400px;
      overflow-y: auto;
    }
    .result-box.placeholder { color: #555; font-style: italic; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #666;
      margin-top: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.idle { background: #666; }
    .status-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
    .status-dot.success { background: #10b981; }
    .status-dot.error { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .model-select {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .model-option {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #3a3a5a;
      background: #0f0f23;
      color: #aaa;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .model-option:hover { border-color: #8b5cf6; }
    .model-option.active {
      border-color: #8b5cf6;
      background: #8b5cf620;
      color: #a78bfa;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 8px;
    }
    .prompt-template {
      font-size: 0.75rem;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 LLM Wiki MVP</h1>
    <p class="subtitle">物理题图片 → 视觉 LLM 识别 → 结构化输出</p>

    <!-- API Key -->
    <div class="card">
      <h2>🔑 配置</h2>
      <div class="row">
        <label>OpenRouter API Key</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
      </div>
      <div class="row">
        <label>模型选择</label>
        <div class="model-select">
          <div class="model-option active" data-model="qwen/qwen3-vl-30b-a3b-thinking:free">Qwen3 VL 30B (免费)</div>
          <div class="model-option" data-model="qwen/qwen3-vl-235b-a22b-thinking:free">Qwen3 VL 235B (免费)</div>
          <div class="model-option" data-model="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash (免费)</div>
          <div class="model-option" data-model="openrouter/free">Auto (免费路由)</div>
        </div>
      </div>
      <div class="row">
        <label>自定义 System Prompt（可选）</label>
        <textarea id="systemPrompt" placeholder="留空则使用默认提示词"></textarea>
        <div class="prompt-template">默认：识别题目内容、提取物理概念、输出结构化文本</div>
      </div>
    </div>

    <!-- 图片上传 -->
    <div class="card">
      <h2>🖼️ 图片</h2>
      <div class="file-input-wrapper" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" />
        <div class="icon">📤</div>
        <div class="text">点击或拖入物理题图片</div>
        <img id="preview" class="preview-img" alt="预览" />
      </div>
    </div>

    <!-- 执行 -->
    <div class="card">
      <button class="btn btn-primary" id="runBtn" disabled>🚀 开始识别</button>
      <div class="status-bar">
        <span><span class="status-dot idle" id="statusDot"></span><span id="statusText">等待图片</span></span>
        <span id="tokenInfo"></span>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- 结果 -->
    <div class="card">
      <h2>📋 识别结果</h2>
      <div class="result-box placeholder" id="resultBox">上传图片后点击"开始识别"...</div>
    </div>
  </div>

  <script>
    const DEFAULT_PROMPT = `你是一位高中物理老师。请分析这张物理题图片，完成以下任务：

1. 识别并提取题目中的所有文字内容（包括公式）
2. 将物理公式转换为标准 LaTeX 格式（行内用$...$，块级用$$...$$）
3. 指出本题考查的物理概念和知识点
4. 列出题目中给出的已知条件
5. 指出要求的未知量

请以结构化格式输出，使用 Markdown：

## 题目原文
（OCR 识别的完整题目文本）

## 物理公式
（题目中涉及的所有公式，LaTeX 格式）

## 考查知识点
（列出涉及的概念）

## 已知条件
（逐一列出）

## 求解目标
（题目要求什么）`;

    let selectedModel = 'qwen/qwen3-vl-30b-a3b-thinking:free';
    let currentBase64 = null;

    // DOM
    const apiKeyInput = document.getElementById('apiKey');
    const systemPromptInput = document.getElementById('systemPrompt');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const dropZone = document.getElementById('dropZone');
    const runBtn = document.getElementById('runBtn');
    const resultBox = document.getElementById('resultBox');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const tokenInfo = document.getElementById('tokenInfo');
    const errorMsg = document.getElementById('errorMsg');
    const modelOptions = document.querySelectorAll('.model-option');

    // Load saved API key
    const savedKey = localStorage.getItem('or_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    // Model selection
    modelOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        modelOptions.forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        selectedModel = opt.dataset.model;
      });
    });

    // File handling
    fileInput.addEventListener('change', handleFile);
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#8b5cf6'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#3a3a5a'; });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.style.borderColor = '#3a3a5a';
      if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
    });

    function handleFile(e) {
      const file = e.target.files[0];
      if (file) processFile(file);
    }

    function processFile(file) {
      if (!file.type.startsWith('image/')) {
        showError('请选择图片文件');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        currentBase64 = reader.result.split(',')[1];
        preview.src = reader.result;
        preview.style.display = 'block';
        runBtn.disabled = !apiKeyInput.value.trim();
        setStatus('ready', '图片已加载');
      };
      reader.readAsDataURL(file);
    }

    apiKeyInput.addEventListener('input', () => {
      runBtn.disabled = !(apiKeyInput.value.trim() && currentBase64);
      if (apiKeyInput.value.trim()) {
        localStorage.setItem('or_api_key', apiKeyInput.value.trim());
      }
    });

    runBtn.addEventListener('click', runRecognition);

    async function runRecognition() {
      if (!currentBase64 || !apiKeyInput.value.trim()) return;

      const apiKey = apiKeyInput.value.trim();
      const systemPrompt = systemPromptInput.value.trim() || DEFAULT_PROMPT;

      runBtn.disabled = true;
      setStatus('loading', '识别中...');
      resultBox.classList.remove('placeholder');
      resultBox.textContent = '正在分析图片，请稍候...';
      errorMsg.textContent = '';
      tokenInfo.textContent = '';

      const startTime = Date.now();

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
            'HTTP-Referer': window.location.origin,
            'X-Title': 'LLM Wiki MVP Test'
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: [
              { role: 'system', content: systemPrompt },
              {
                role: 'user',
                content: [
                  { type: 'text', text: '请分析这张物理题：' },
                  { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${currentBase64}` } }
                ]
              }
            ],
            temperature: 0.3,
            max_tokens: 2000
          })
        });

        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`API 错误 ${response.status}: ${errText}`);
        }

        const data = await response.json();
        const content = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || '(无返回内容)';
        const usage = data.usage || {};

        resultBox.textContent = content;
        setStatus('success', `耗时 ${elapsed}s`);
        tokenInfo.textContent = `Tokens: ${usage.prompt_tokens || '?'} prompt + ${usage.completion_tokens || '?'} completion${usage.total_tokens ? ` (${usage.total_tokens} total)` : ''}`;

      } catch (err) {
        showError(err.message);
        setStatus('error', '识别失败');
      } finally {
        runBtn.disabled = false;
      }
    }

    function setStatus(state, text) {
      statusDot.className = 'status-dot ' + state;
      statusText.textContent = text;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
    }
  </script>
</body>
</html>
